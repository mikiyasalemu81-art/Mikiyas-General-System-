<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mikiyas Blocker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-weight: 600;
    }
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .app-info {
      display: flex;
      flex-direction: column;
    }
    .app-name {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }
    .app-meta {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ef4444;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .btn-sync {
      width: 100%;
      background: #0ea5e9;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sync:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      🛡️ System for Mikiyas
    </div>
    <div class="status-badge" id="active-badge">Active</div>
  </div>

  <div class="app-list" id="apps-container">
    <!-- Populated by popup.js -->
  </div>

  <button class="btn-sync" id="open-dashboard-btn">Open Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
